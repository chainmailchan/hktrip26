<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, before the trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&amp;family=EB+Garamond:wght@500;600&amp;family=Figtree:wght@400;600;700;800&amp;family=Noto+Sans+HK:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#22211F}a:hover{color:#000000}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sway{transform-origin:222px 96px;animation:sway 4s ease-in-out infinite}
.dash{animation:dash 2.4s linear infinite}
.fadein{animation:fadein 1.2s ease-out both}
@media (prefers-reduced-motion: reduce){.sway,.dash,.fadein{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3F0EA; color: #22211F; font-family: 'Figtree', 'Noto Sans HK', sans-serif">

  <div class="fadein" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px">
    <svg width="390" height="340" viewBox="0 0 390 340" fill="none" stroke="#2B2A27" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Line drawing of a packed suitcase with a luggage tag" style="position: absolute; top: 286px; left: 0">
      <path class="dash" d="M24 118Q120 10 250 40T380 60" stroke="#A6A198" stroke-dasharray="3 9"></path>
      <rect x="120" y="110" width="150" height="180" rx="18"></rect>
      <path d="M170 110V88Q170 78 180 78H210Q220 78 220 88V110"></path>
      <path d="M150 118V282M240 118V282" stroke="#A6A198"></path>
      <path d="M120 200H270" stroke="#A6A198"></path>
      <circle cx="142" cy="300" r="8"></circle>
      <circle cx="248" cy="300" r="8"></circle>
      <g class="sway">
        <path d="M222 96Q246 104 258 128"></path>
        <path d="M254 126L286 138L276 172L244 160Z" fill="#F3F0EA"></path>
        <circle cx="260" cy="138" r="3"></circle>
        <path d="M256 150L274 157M253 158L268 164" stroke="#A6A198"></path>
      </g>
      <path d="M50 320H340" stroke="#A6A198"></path>
    </svg>
  </div>

  <div style="position: relative; height: 844px; box-sizing: border-box; padding: 36px 24px 20px; display: flex; flex-direction: column; text-shadow: 0 0 2px #F3F0EA, 0 0 6px #F3F0EA, 0 0 12px #F3F0EA">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 lang="zh-Hant" style="margin: 0; font-family: 'Noto Sans HK', sans-serif; font-size: 54px; font-weight: 700; line-height: 1.05; letter-spacing: 0.04em">早晨</h1>
        <div style="font-family: {{display}}; font-size: 18px; color: #5F5C56">Saturday 31 October · Singapore</div>
      </div>
      <button type="button" style="min-height: 56px; padding: 0 4px 0 16px; border: none; background: transparent; color: #A8382C; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Help</button>
    </div>
    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 26px; font-weight: 700">17 days to Hong Kong</div>
      <div style="font-size: 20px">Mama & Papa have packed 2 of 5 things.</div>
    </div>

    <section aria-label="Announcement from Chan" style="margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(34, 33, 31, 0.15); display: flex; flex-direction: column; gap: 4px; text-shadow: 0 0 2px #F3F0EA, 0 0 6px #F3F0EA, 0 0 12px #F3F0EA">
      <div style="font-size: 17px; font-weight: 700; color: #22211F">Announcement · from Chan</div>
      <div style="font-size: 19px; font-weight: 600; line-height: 1.35">Please pack by Saturday 14 November.</div>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
      <a href="Packing.dc.html" style="text-shadow: none; height: 60px; border-radius: 30px; background: #22211F; color: #F3F0EA; font-size: 19px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Packing list</a>
      <a href="Packing.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #5F5C56; text-decoration: none; text-shadow: 0 0 2px #F3F0EA, 0 0 6px #F3F0EA, 0 0 12px #F3F0EA">Chan & Belle have packed 3 of 11 things</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"displayFont":{"editor":"enum","options":["Figtree","Barlow Condensed","EB Garamond"],"default":"Barlow Condensed","section":"Type"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const f = this.props.displayFont ?? 'Barlow Condensed';
    return { display: "'" + f + "', sans-serif" };
  }
}
</script>
</body>
</html>
