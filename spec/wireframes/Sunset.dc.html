<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, early evening</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&amp;family=EB+Garamond:wght@500;600&amp;family=Figtree:wght@400;600;700;800&amp;family=Noto+Sans+HK:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F4ECDC}a:hover{color:#FFFFFF}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein 1.6s ease-out both}
.rise{animation:rise 1.4s ease-out both}
@media (prefers-reduced-motion: reduce){.fadein,.rise{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #022761; color: #F4ECDC; font-family: 'Figtree', 'Noto Sans HK', sans-serif">

  <img class="rise" src="../../art/home-evening-moonlit-harbour.jpg" alt="" style="{{imgStyle}}">
  <div class="fadein" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: {{wash}}"></div>

  <div style="position: relative; height: 844px; box-sizing: border-box; padding: 36px 24px 18px; display: flex; flex-direction: column; text-shadow: 0 0 2px #022761, 0 0 6px #022761, 0 0 12px #022761">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 lang="zh-Hant" style="margin: 0; font-family: 'Noto Sans HK', sans-serif; font-size: 54px; font-weight: 700; line-height: 1.05; letter-spacing: 0.04em; color: #F4ECDC">餓冇？</h1>
        <div style="font-family: {{display}}; font-size: 18px; color: #C9CFE0">Wednesday 18 November · 6:40 pm</div>
      </div>
      <a href="Help.dc.html" style="min-height: 56px; padding: 0 2px 0 10px; color: #F4A28C; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Help</a>
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 20px">21°, clear evening</div>
      <div style="font-size: 20px; font-weight: 700">A light jacket for later.</div>
    </div>

    <section aria-label="Announcement from Chan" style="margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(244, 236, 220, 0.25); display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 17px; font-weight: 700; color: #F4ECDC">Announcement · from Chan</div>
      <div style="font-size: 19px; font-weight: 600; line-height: 1.35">Dinner at 7:30. Meet in the lobby.</div>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
      <a href="Schedule.dc.html" style="text-shadow: none; height: 60px; border-radius: 30px; background: #F4ECDC; color: #022761; font-size: 19px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Tonight's plan</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"soften":{"editor":"range","min":0,"max":70,"step":5,"unit":"%","default":20,"section":"Art"},"displayFont":{"editor":"enum","options":["Figtree","Barlow Condensed","EB Garamond"],"default":"Barlow Condensed","section":"Type"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const f = this.props.displayFont ?? 'Barlow Condensed';
    const s = (this.props.soften ?? 20) / 100;
    // 1089x2336 source (phone-shaped): covers the screen with about 2 px trimmed each side
    const imgStyle = 'position: absolute; top: 0; left: 0; width: 390px; height: 844px; object-fit: cover; object-position: center';
    return { display: "'" + f + "', sans-serif", wash: 'rgba(2, 39, 97, ' + s + ')', imgStyle };
  }
}
</script>
</body>
</html>
