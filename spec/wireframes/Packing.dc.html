<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packing list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&amp;family=EB+Garamond:wght@500;600&amp;family=Figtree:wght@400;600;700;800&amp;family=Noto+Sans+HK:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#22211F}a:hover{color:#000000}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein .35s ease-out both}
@media (prefers-reduced-motion: reduce){.fadein{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F0EA; color: #22211F; font-family: 'Figtree', 'Noto Sans HK', sans-serif; display: flex; flex-direction: column; padding: 20px 24px 16px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="PreTrip.dc.html" style="height: 52px; padding: 0 18px; border: 1.5px solid #22211F; border-radius: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; text-decoration: none"><span aria-hidden="true">←</span>Home</a>
    <button type="button" style="min-height: 56px; padding: 0 4px 0 16px; border: none; background: transparent; color: #A8382C; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">Help</button>
  </div>

  <h1 style="margin: 14px 0 4px; font-family: {{display}}; font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em">Packing</h1>

  <div role="tablist" aria-label="Which list (Chan and Belle's phones only)" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #DAD5CB">
    <sc-for list="{{lists}}" as="l" hint-placeholder-count="2">
      <button type="button" role="tab" onClick="{{l.pick}}" style="{{l.style}}">
        <span style="font-size: 18px">{{l.name}}</span>
        <span style="font-size: 17px; color: #5F5C56">{{l.count}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 12px 0 6px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 18px"><strong>{{who}}</strong> · {{done}} of {{total}} packed</div>
    <div style="height: 3px; background: #DAD5CB; border-radius: 2px"><div style="{{barStyle}}"></div></div>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <section style="border-top: 1px solid #DAD5CB">
      <button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="width: 100%; min-height: 58px; display: flex; justify-content: space-between; align-items: center; background: transparent; border: none; padding: 0; font-family: inherit; color: #22211F; cursor: pointer; text-align: left">
        <span style="font-size: 21px; font-weight: 700">{{g.name}}</span>
        <span style="font-size: 17px; color: #5F5C56">{{g.count}}</span>
      </button>
      <sc-if value="{{g.open}}" hint-placeholder-val="{{ false }}">
        <div class="fadein" style="padding: 0 0 8px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <label style="min-height: 56px; display: flex; gap: 14px; align-items: center; cursor: pointer; border-top: 1px dashed #DAD5CB">
              <input type="checkbox" checked="{{it.checked}}" onChange="{{it.toggle}}" style="width: 26px; height: 26px; flex-shrink: 0; accent-color: #22211F">
              <span style="display: flex; flex-direction: column; padding: 6px 0">
                <span style="{{it.style}}">{{it.name}}</span>
                <sc-if value="{{it.hasNote}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 17px; color: #5F5C56; line-height: 1.3">{{it.note}}</span>
                </sc-if>
              </span>
            </label>
          </sc-for>
        </div>
      </sc-if>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"displayFont":{"editor":"enum","options":["Figtree","Barlow Condensed","EB Garamond"],"default":"Figtree","section":"Type"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      list: 'mp',
      open: { cb: 'docs', mp: 'must' },
      done: { cb: ['passports', 'phones', 'uber'], mp: ['passports', 'phones'] }
    };
  }
  renderVals() {
    const f = this.props.displayFont ?? 'Figtree';
    const data = {
      cb: [
        { id: 'docs', name: 'Documents and phones', items: [
          { id: 'passports', name: 'Passports' },
          { id: 'phones', name: 'Phones and chargers' },
          { id: 'uber', name: 'Uber and DiDi set up' },
          { id: 'roaming', name: 'China roaming on all four phones', note: 'Check Mama and Papa’s SIMBA plan' }
        ] },
        { id: 'power', name: 'Power', items: [
          { id: 'pbank', name: 'Power banks, at most 2 each', note: 'Cabin bag only. Not allowed to use them on the plane.' },
          { id: 'adapter', name: 'Plug adapter for Shenzhen', note: 'Hong Kong plugs are the same as Singapore’s' }
        ] },
        { id: 'clothes', name: 'Clothes and comfort', items: [
          { id: 'shoes', name: 'Walking shoes' },
          { id: 'jacket', name: 'Light jacket' },
          { id: 'umbrella', name: 'Small umbrella' }
        ] },
        { id: 'family', name: 'Health and family', items: [
          { id: 'meds', name: 'Daily medication', note: 'In the cabin bag' },
          { id: 'airtag', name: 'AirTag shared with Mama and Belle', note: 'In Find My' }
        ] }
      ],
      mp: [
        { id: 'must', name: 'Must bring', items: [
          { id: 'passports', name: 'Passports' },
          { id: 'phones', name: 'Phones and chargers' },
          { id: 'meds', name: 'Daily medication', note: 'In your cabin bag' },
          { id: 'airtag', name: 'AirTag', note: 'In Mama’s handbag' },
          { id: 'shoes', name: 'Comfortable walking shoes' }
        ] }
      ]
    };
    const names = { cb: 'Chan & Belle', mp: 'Mama & Papa' };
    const count = (lid) => {
      const all = data[lid].reduce((n, g) => n + g.items.length, 0);
      return { d: this.state.done[lid].length, all };
    };
    const lid = this.state.list;
    const doneSet = this.state.done[lid];
    const tabBase = 'min-height: 60px; border: none; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; ';
    const lists = ['cb', 'mp'].map((id) => {
      const k = count(id);
      const on = id === lid;
      return {
        name: names[id],
        count: k.d + ' of ' + k.all,
        style: tabBase + (on ? 'font-weight: 700; color: #22211F; border-bottom: 3px solid #22211F' : 'color: #5F5C56; border-bottom: 3px solid transparent'),
        pick: () => this.setState({ list: id })
      };
    });
    const groups = data[lid].map((g) => {
      const d = g.items.filter((i) => doneSet.includes(i.id)).length;
      return {
        name: g.name,
        count: d + ' of ' + g.items.length,
        open: this.state.open[lid] === g.id,
        toggle: () => this.setState({ open: { ...this.state.open, [lid]: this.state.open[lid] === g.id ? '' : g.id } }),
        items: g.items.map((i) => {
          const checked = doneSet.includes(i.id);
          return {
            name: i.name,
            note: i.note || '',
            hasNote: !!i.note,
            checked,
            style: 'font-size: 19px; font-weight: 600; ' + (checked ? 'color: #8A867E; text-decoration: line-through' : 'color: #22211F'),
            toggle: () => {
              const cur = this.state.done[lid];
              const next = cur.includes(i.id) ? cur.filter((x) => x !== i.id) : cur.concat(i.id);
              this.setState({ done: { ...this.state.done, [lid]: next } });
            }
          };
        })
      };
    });
    const k = count(lid);
    return {
      display: "'" + f + "', sans-serif",
      lists,
      groups,
      who: names[lid],
      done: k.d,
      total: k.all,
      barStyle: 'height: 3px; border-radius: 2px; background: #22211F; width: ' + Math.round((k.d / k.all) * 100) + '%'
    };
  }
}
</script>
</body>
</html>
